id: io.github.tyamada.Folimeld
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: folimeld

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: folimeld-deps
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}/wheels" --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps wheels/*.whl
    sources:
      - type: dir
        path: wheels
        dest: wheels

  - name: folimeld
    buildsystem: simple
    build-commands:
      - install -dm755 ${FLATPAK_DEST}/share/folimeld
      - cp -a folimeld locales assets main.py LICENSE ${FLATPAK_DEST}/share/folimeld/
      - if [ -d licenses ]; then cp -a licenses ${FLATPAK_DEST}/share/folimeld/; fi
      - install -Dm755 folimeld-flatpak-launch ${FLATPAK_DEST}/bin/folimeld
      - install -Dm644 io.github.tyamada.Folimeld.desktop ${FLATPAK_DEST}/share/applications/io.github.tyamada.Folimeld.desktop
      - install -Dm644 io.github.tyamada.Folimeld.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.tyamada.Folimeld.metainfo.xml
      - for sz in 16 32 64 128 256 512; do install -Dm644 "assets/Folimeld.iconset/icon_${sz}x${sz}.png" "${FLATPAK_DEST}/share/icons/hicolor/${sz}x${sz}/apps/io.github.tyamada.Folimeld.png"; done
    sources:
      - type: dir
        path: src
      - type: file
        path: folimeld-flatpak-launch
      - type: file
        path: io.github.tyamada.Folimeld.desktop
      - type: file
        path: io.github.tyamada.Folimeld.metainfo.xml
